# HayabusaPress — Nginx sample configuration
# Replace "example.com" and ADMIN_PATH ("admin") with your actual values.
# This file is not used directly; copy and adapt it for your server.

server {
    listen 80;
    server_name example.com www.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name example.com www.example.com;

    root /var/www/hayabusapress/public;
    index index.php;

    ssl_certificate     /etc/letsencrypt/live/example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/example.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # Block direct access to sensitive directories (plugins/ も含む)
    location ~ ^/(storage|core|plugins|themes)(/|$) {
        deny all;
        return 403;
    }

    # Deny dotfiles (.env, .htaccess 等)
    location ~ /\.(?!well-known) {
        deny all;
    }

    # ============================================================
    # サイトマップを静的ファイルとして配信（PHP非経由）
    # ============================================================

    # sitemap.xml インデックス（ルート）
    location = /sitemap.xml {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=3600";
        add_header Content-Type  "application/xml; charset=UTF-8";
    }

    # robots.txt 静的配信
    location = /robots.txt {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=86400";
    }

    # 分割サブサイトマップ（/sitemaps/*.xml）
    location ~ ^/sitemaps/[^/]+\.xml$ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=3600";
        add_header Content-Type  "application/xml; charset=UTF-8";
    }

    # Atom/RSS フィード静的配信
    # ファイルが存在すれば直接配信。存在しなければ index.php へフォールバック（Auto-Healing）。
    # デフォルト言語: /feed.atom.xml, /feed.rss.xml
    # 非デフォルト言語: /{lang}/feed.atom.xml, /{lang}/feed.rss.xml
    location = /feed.atom.xml {
        try_files $uri /index.php$is_args$args;
        add_header Cache-Control "public, max-age=3600";
        add_header Content-Type  "application/atom+xml; charset=UTF-8";
    }
    location = /feed.rss.xml {
        try_files $uri /index.php$is_args$args;
        add_header Cache-Control "public, max-age=3600";
        add_header Content-Type  "application/rss+xml; charset=UTF-8";
    }
    location ~ ^/[a-z]{2,5}/feed\.(atom|rss)\.xml$ {
        try_files $uri /index.php$is_args$args;
        add_header Cache-Control "public, max-age=3600";
    }

    # ============================================================
    # 外部CSS（CSS_DELIVERY=external 時）far-future cache
    # ============================================================
    location ~ ^/assets/style\.[a-f0-9]+\.css$ {
        expires max;
        add_header Cache-Control "public, immutable, max-age=31536000";
        try_files $uri =404;
    }

    # Static assets served directly with long-lived cache headers
    location ~* \.(css|js|png|jpg|jpeg|gif|ico|svg|webp|woff|woff2|ttf|otf)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Admin panel — change "admin" to match ADMIN_PATH in your .env
    # 管理画面IP制限をアプリ層で実装済みのため nginx 追加制限は任意
    # （固定IPがある場合のみ uncomment して使用）
    # allow 203.0.113.0/24;
    # deny all;
    location ~ ^/admin(/.*)?$ {
        try_files $uri /admin/index.php$is_args$args;
    }

    # Front controller
    location / {
        try_files $uri /index.php$is_args$args;
    }

    location ~ \.php$ {
        fastcgi_pass   unix:/run/php/php8.2-fpm.sock;
        fastcgi_index  index.php;
        fastcgi_param  SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include        fastcgi_params;
        fastcgi_read_timeout 60;

        # セキュリティヘッダは PHP 側（SecurityHeaderCompiler）で出力する
        # nginx 側では X-Content-Type-Options のみ上乗せ
        add_header X-Content-Type-Options nosniff always;
    }

    access_log /var/log/nginx/hbp_access.log;
    error_log  /var/log/nginx/hbp_error.log;
}
